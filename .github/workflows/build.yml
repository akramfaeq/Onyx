name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        cache: true

    # ── نفس ما يسويه build.gradle.kts بالضبط ──
    - name: Download and extract hiddify-core AAR
      run: |
        mkdir -p android/app/libs
        mkdir -p /tmp/hiddify-core-work

        # نفس الـ URL الموجود في build.gradle.kts
        URL="https://github.com/hiddify/hiddify-core/releases/download/v4.1.0/hiddify-lib-android.tar.gz"
        echo "Downloading: $URL"
        curl -L --retry 3 --connect-timeout 30 --max-time 300 \
          -o /tmp/hiddify-core-work/hiddify-lib-android.tar.gz "$URL"

        SIZE=$(stat -c%s /tmp/hiddify-core-work/hiddify-lib-android.tar.gz)
        echo "Downloaded tar.gz size: $SIZE bytes"

        # فك الضغط
        tar -xzf /tmp/hiddify-core-work/hiddify-lib-android.tar.gz \
          -C /tmp/hiddify-core-work/

        # دور على الـ .aar
        AAR=$(find /tmp/hiddify-core-work -name "*.aar" | head -1)
        echo "Found AAR: $AAR"

        if [ -z "$AAR" ]; then
          echo "Contents of extracted archive:"
          find /tmp/hiddify-core-work -type f | head -20
          exit 1
        fi

        cp "$AAR" android/app/libs/hiddify-core.aar
        AARSIZE=$(stat -c%s android/app/libs/hiddify-core.aar)
        echo "✅ hiddify-core.aar ready: $AARSIZE bytes"

    - name: Update Gradle version
      run: |
        sed -i 's#gradle-8.3-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Prepare Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        else
          keytool -genkeypair -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nemo112233 -keypass nemo112233 \
            -dname "CN=OnyxVPN, O=Onyx, C=IQ"
        fi

    - name: Build APK
      env:
        # نخبر Gradle إن الـ AAR جاهز عشان ما يحاول يعيد التحميل
        HIDDIFY_CORE_AAR_READY: "true"
      run: flutter build apk --release

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "OnyxVPN v1.0.${{ github.run_number }}"
        body: "🚀 OnyxVPN Auto Build"
        files: build/app/outputs/flutter-apk/app-release.apk
