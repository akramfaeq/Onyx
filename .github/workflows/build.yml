name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # كل أسبوع الاثنين 9 صباحاً — يبني تلقائياً لو في كور جديد
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        cache: true

    # ─── نفس هايدفاي: نجيب أحدث إصدار من hiddify-core تلقائياً ───
    - name: Set hiddify-core version
      id: core_version
      run: |
        VERSION="v4.3.3"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✅ hiddify-core pinned: $VERSION"

    - name: Download hiddify-core.aar
      run: |
        mkdir -p android/app/libs
        VERSION="${{ steps.core_version.outputs.version }}"
        URL="https://github.com/hiddify/hiddify-core/releases/download/${VERSION}/hiddify-lib-android.tar.gz"
        echo "⬇️ Downloading hiddify-core ${VERSION}..."
        curl -L "$URL" -o /tmp/hiddify-lib.tar.gz
        tar -xzf /tmp/hiddify-lib.tar.gz -C /tmp/
        find /tmp -name "*.aar" | head -1 | xargs -I{} cp {} android/app/libs/hiddify-core.aar
        echo "✅ hiddify-core.aar downloaded"

    - name: Update Gradle version
      run: |
        sed -i 's#gradle-8.3-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Prepare Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        else
          keytool -genkeypair -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nemo112233 -keypass nemo112233 \
            -dname "CN=OnyxVPN, O=Onyx, C=IQ"
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "OnyxVPN v1.0.${{ github.run_number }} (core ${{ steps.core_version.outputs.version }})"
        body: |
          🔧 hiddify-core: `${{ steps.core_version.outputs.version }}`
          🤖 Auto-built from latest core
        files: build/app/outputs/flutter-apk/app-release.apk
