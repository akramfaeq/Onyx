name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Update Gradle and AGP versions
      run: |
        sed -i 's/version "8.1.0" apply false/version "8.7.3" apply false/' android/settings.gradle.kts
        sed -i 's#gradle-8.3-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Prepare Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        elif [ ! -f android/app/upload-keystore.jks ]; then
          keytool -genkeypair -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nemo112233 -keypass nemo112233 \
            -dname "CN=OnyxVPN, O=Onyx, C=IQ"
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Build AAB
      run: flutter build appbundle --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: build/app/outputs/bundle/release/app-release.aab

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: OnyxVPN v1.0.${{ github.run_number }}
        files: build/app/outputs/flutter-apk/app-release.apk
