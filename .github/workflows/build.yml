name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        cache: true

    - name: Download hiddify-core AAR
      run: |
        rm -f android/app/libs/hiddify-core.aar
        mkdir -p android/app/libs

        # جرب كل أسماء الملفات الممكنة في v4
        CORE_VERSION="v4.7.0"
        URLS=(
          "https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/libcore.aar"
          "https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/Libcore.aar"
          "https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/hiddify-core.aar"
          "https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/hiddify-libcore.aar"
        )

        for URL in "${URLS[@]}"; do
          echo "Trying: $URL"
          curl -L --retry 2 -w "%{http_code}" -o android/app/libs/hiddify-core.aar "$URL" 2>/dev/null
          SIZE=$(stat -c%s android/app/libs/hiddify-core.aar)
          echo " | Size: $SIZE"
          if [ "$SIZE" -gt 1000000 ]; then
            echo "✅ Got it from: $URL"
            break
          fi
        done

        # لو كل شيء فشل، اعرض الأصول الموجودة
        SIZE=$(stat -c%s android/app/libs/hiddify-core.aar)
        if [ "$SIZE" -lt 1000000 ]; then
          echo "❌ All failed. Available assets:"
          curl -s "https://api.github.com/repos/hiddify/hiddify-core/releases/tags/${CORE_VERSION}" | grep '"browser_download_url"'
          exit 1
        fi

    - name: Update Gradle version
      run: |
        sed -i 's#gradle-8.3-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Prepare Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        else
          keytool -genkeypair -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nemo112233 -keypass nemo112233 \
            -dname "CN=OnyxVPN, O=Onyx, C=IQ"
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "OnyxVPN v1.0.${{ github.run_number }}"
        body: "🚀 OnyxVPN Auto Build"
        files: build/app/outputs/flutter-apk/app-release.apk
