name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        cache: true

    - name: Download hiddify-core AAR
      run: |
        rm -f android/app/libs/hiddify-core.aar
        mkdir -p android/app/libs

        CORE_VERSION=$(curl -s https://api.github.com/repos/hiddify/hiddify-core/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
        echo "Core version: $CORE_VERSION"

        # v5+ يستخدم tar.gz بدل .aar مباشرة
        URL="https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/hiddify-lib-android.tar.gz"
        echo "Downloading: $URL"

        curl -L --retry 3 -o /tmp/hiddify-lib-android.tar.gz "$URL"

        # فك الضغط
        tar -xzf /tmp/hiddify-lib-android.tar.gz -C /tmp/

        # دور على الـ .aar
        AAR_FILE=$(find /tmp -name "*.aar" | head -1)
        echo "Found AAR: $AAR_FILE"

        if [ -z "$AAR_FILE" ]; then
          echo "No .aar found, listing extracted files:"
          find /tmp -name "*android*" -o -name "*.aar" -o -name "*.jar"
          exit 1
        fi

        cp "$AAR_FILE" android/app/libs/hiddify-core.aar

        SIZE=$(stat -c%s android/app/libs/hiddify-core.aar)
        echo "✅ AAR size: $SIZE bytes"

        if [ "$SIZE" -lt 1000000 ]; then
          echo "❌ AAR too small!"
          exit 1
        fi

    - name: Update Gradle version
      run: |
        sed -i 's#gradle-8.3-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Prepare Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        else
          keytool -genkeypair -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nemo112233 -keypass nemo112233 \
            -dname "CN=OnyxVPN, O=Onyx, C=IQ"
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "OnyxVPN v1.0.${{ github.run_number }}"
        body: |
          🚀 OnyxVPN Auto Build
          🤖 Built from latest hiddify-core
        files: build/app/outputs/flutter-apk/app-release.apk
