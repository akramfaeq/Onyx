name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        cache: true

    # ── نثبّت v4.7.0 لأنه يدعم .aar مباشرة ──
    - name: Download hiddify-core AAR (v4)
      run: |
        rm -f android/app/libs/hiddify-core.aar
        mkdir -p android/app/libs

        CORE_VERSION="v4.7.0"
        URL="https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/hiddify-core-android.aar"
        echo "Downloading hiddify-core $CORE_VERSION"

        curl -L --retry 3 -o android/app/libs/hiddify-core.aar "$URL"

        SIZE=$(stat -c%s android/app/libs/hiddify-core.aar)
        echo "AAR size: $SIZE bytes"

        if [ "$SIZE" -lt 1000000 ]; then
          echo "❌ Download failed!"
          exit 1
        fi
        echo "✅ hiddify-core.aar ready"

    - name: Update Gradle version
      run: |
        sed -i 's#gradle-8.3-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Prepare Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        else
          keytool -genkeypair -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nemo112233 -keypass nemo112233 \
            -dname "CN=OnyxVPN, O=Onyx, C=IQ"
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "OnyxVPN v1.0.${{ github.run_number }}"
        body: |
          🚀 OnyxVPN Auto Build
          🤖 Built with hiddify-core v4.7.0
        files: build/app/outputs/flutter-apk/app-release.apk
