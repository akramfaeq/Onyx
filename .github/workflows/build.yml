name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        cache: true

    - name: Download hiddify-core AAR
      run: |
        rm -f android/app/libs/hiddify-core.aar
        mkdir -p android/app/libs

        # جيب أحدث إصدار
        CORE_VERSION=$(curl -s https://api.github.com/repos/hiddify/hiddify-core/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
        echo "Core version: $CORE_VERSION"

        # جرب الأسماء المختلفة للـ AAR
        URLS=(
          "https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/hiddify-core-android.aar"
          "https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/libcore-android.aar"
          "https://github.com/hiddify/hiddify-core/releases/download/${CORE_VERSION}/hiddify-libcore-android.aar"
        )

        for URL in "${URLS[@]}"; do
          echo "Trying: $URL"
          HTTP_CODE=$(curl -L --retry 3 -w "%{http_code}" -o android/app/libs/hiddify-core.aar "$URL")
          SIZE=$(stat -c%s android/app/libs/hiddify-core.aar)
          echo "HTTP: $HTTP_CODE | Size: $SIZE bytes"
          if [ "$SIZE" -gt 1000000 ]; then
            echo "✅ Downloaded successfully from: $URL"
            break
          fi
        done

        # تحقق نهائي
        SIZE=$(stat -c%s android/app/libs/hiddify-core.aar)
        if [ "$SIZE" -lt 1000000 ]; then
          echo "❌ All download attempts failed!"
          # اعرض كل الأصول الموجودة في الـ release
          echo "Available assets in $CORE_VERSION:"
          curl -s "https://api.github.com/repos/hiddify/hiddify-core/releases/latest" | grep '"browser_download_url"'
          exit 1
        fi

    - name: Update Gradle version
      run: |
        sed -i 's#gradle-8.3-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Prepare Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        else
          keytool -genkeypair -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nemo112233 -keypass nemo112233 \
            -dname "CN=OnyxVPN, O=Onyx, C=IQ"
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "OnyxVPN v1.0.${{ github.run_number }}"
        body: |
          🚀 OnyxVPN Auto Build
          🤖 Built from latest hiddify-core
        files: build/app/outputs/flutter-apk/app-release.apk
