name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        cache: true

    # ── نحذف الـ placeholder عشان build.gradle.kts يتكفل بالتحميل ──
    - name: Remove placeholder AAR
      run: |
        rm -f android/app/libs/hiddify-core.aar
        echo "Placeholder removed - build.gradle.kts will download the real AAR"

    - name: Update Gradle version
      run: |
        sed -i 's#gradle-8.3-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Prepare Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        else
          keytool -genkeypair -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nemo112233 -keypass nemo112233 \
            -dname "CN=OnyxVPN, O=Onyx, C=IQ"
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "OnyxVPN v1.0.${{ github.run_number }}"
        body: "🚀 OnyxVPN Auto Build"
        files: build/app/outputs/flutter-apk/app-release.apk
