name: onyx_vpn
description: OnyxVPN - Fast & Secure VPN

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── VPN Engine ──────────────────────────────────────────
  # الاسم الصحيح على pub.dev
  flutter_singbox_client: ^1.0.1

  # ─── Network ─────────────────────────────────────────────
  http: ^1.2.0

  # ─── State Management ────────────────────────────────────
  provider: ^6.1.2

  # ─── Storage ─────────────────────────────────────────────
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ─── Ads ─────────────────────────────────────────────────
  unity_ads_plugin: ^0.5.0

  # ─── UI ──────────────────────────────────────────────────
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
