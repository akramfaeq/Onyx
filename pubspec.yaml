name: onyx_vpn
description: OnyxVPN - Fast & Secure VPN

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Network ─────────────────────────────────────────────
  http: ^1.2.0
  cryptography: ^2.7.0

  # ─── State Management ────────────────────────────────────
  provider: ^6.1.2

  # ─── Storage ─────────────────────────────────────────────
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # ─── Database (Drift — نفس SQLite اللي يستخدمه Hiddify) ──
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0

  # ─── Ads ─────────────────────────────────────────────────
  unity_ads_plugin: ^0.5.0

  # ─── UI ──────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  # ─── Drift code generator ────────────────────────────────
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#08080F"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
