name: onyx_vpn
description: OnyxVPN App

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  csv: ^6.0.0
  flutter_animate: ^4.5.0
  provider: ^6.1.2
  supabase_flutter: ^2.3.0
  shared_preferences: ^2.2.2
  unity_ads_plugin: ^0.5.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ─── VPN ──────────────────────────────────────────────────────
  # OpenVPN — الأساس الشغّال
  openvpn_flutter: ^1.3.3
  # V2Ray — للمستقبل (VLESS+WS+Cloudflare)
  flutter_v2ray: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
